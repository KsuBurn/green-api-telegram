name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # или master, смотря какая у вас ветка по умолчанию

# Разрешаем скрипту деплоить на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # замените на pnpm или yarn, если используете их

      - name: Install dependencies
        run: npm ci # или npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Папка, куда Vite собирает проект

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
